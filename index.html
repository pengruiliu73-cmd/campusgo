<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px 60px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; position: relative; }
        .language-switch { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s; }
        .language-switch:hover { background: rgba(255,255,255,0.3); }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        p.subtitle { margin: 10px 0 0; opacity: 0.9; font-size: 14px; }
        .container { max-width: 600px; margin: -30px auto 0; padding: 0 20px; position: relative; z-index: 10; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-decoration: none; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        .card-title { font-weight: bold; font-size: 16px; margin-top: 10px; text-align: center; }
        /* 简单的图标占位 */
        .icon { width: 32px; height: 32px; background: #eef2ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #667eea; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <button class="language-switch" id="langBtn" onclick="toggleLanguage()">Language</button>
        <h1 id="mainTitle">CampusGo</h1>
        <p class="subtitle" id="subTitle">您的校园生活助手</p>
    </div>

    <div class="container">
        <div class="grid">
            <!-- 注意：href 后面加了 ?type=express 等参数，用于告诉下一页是什么任务 -->
            <a href="order.html?type=express" class="card">
                <div class="icon">📦</div>
                <div class="card-title" data-zh="代取快递" data-ko="택배 수령">代取快递</div>
            </a>
            <a href="order.html?type=food" class="card">
                <div class="icon">🍱</div>
                <div class="card-title" data-zh="食堂带饭" data-ko="식사 배달">食堂带饭</div>
            </a>
            <a href="order.html?type=print" class="card">
                <div class="icon">📚</div>
                <div class="card-title" data-zh="资料打印" data-ko="자료 인쇄">资料打印</div>
            </a>
            <a href="order.html?type=medicine" class="card">
                <div class="icon">💊</div>
                <div class="card-title" data-zh="代买药品" data-ko="약 구매">代买药品</div>
            </a>
        </div>
    </div>

    <script>
        // 定义翻译字典
        const translations = {
            zh: { btn: "English", title: "CampusGo", sub: "您的校园生活助手" },
            ko: { btn: "한국어", title: "CampusGo", sub: "캠퍼스 라이프 도우미" } // 假设你需要韩语
        };

        // 初始化：检查有没有保存过的语言设置
        let currentLang = localStorage.getItem('app_lang') || 'zh';
        applyLanguage(currentLang);

        function toggleLanguage() {
            // 切换语言
            currentLang = currentLang === 'zh' ? 'ko' : 'zh';
            localStorage.setItem('app_lang', currentLang); // 保存到本地存储
            applyLanguage(currentLang);
        }

        function applyLanguage(lang) {
            // 更新顶部文字
            document.getElementById('langBtn').innerText = translations[lang].btn;
            document.getElementById('mainTitle').innerText = translations[lang].title;
            document.getElementById('subTitle').innerText = translations[lang].sub;

            // 更新卡片文字
            const titles = document.querySelectorAll('.card-title');
            titles.forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }
    </script>
</body>
</html>
