<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo - 校园生活助手</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
        }

        /* 顶部紫色区域样式 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
        }

        /* 语言切换按钮 */
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }

        .language-switch:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .logo-area h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-area p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 卡片容器 */
        .container {
            padding: 0 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 任务卡片样式 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: -20px; /* 让卡片稍微盖住一点紫色背景，增加层次感 */
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background-color: #f0f2f5;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .card-content h3 {
            margin: 0 0 5px;
            font-size: 18px;
            color: #2c3e50;
        }

        .card-content p {
            margin: 0;
            font-size: 13px;
            color: #7f8c8d;
        }

        /* 简单的动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }

    </style>
</head>
<body>

    <!-- 顶部 Header -->
    <div class="header">
        <!-- 语言切换按钮 -->
        <div class="language-switch" onclick="toggleLanguage()">
            <span id="lang-icon">🌐</span>
            <span id="lang-text">语言</span>
        </div>

        <div class="logo-area">
            <h1 id="main-title">CampusGo 🚀</h1>
            <p id="sub-title">你的校园生活小助手</p>
        </div>
    </div>

    <!-- 卡片列表区域 -->
    <div class="container">
        <!-- 卡片 1 -->
        <div class="card">
            <div class="icon-box">📦</div>
            <div class="card-content">
                <h3 id="card1-title">代取快递</h3>
                <p id="card1-desc">大件重物不用愁</p>
            </div>
        </div>

        <!-- 卡片 2 -->
        <div class="card">
            <div class="icon-box">🍱</div>
            <div class="card-content">
                <h3 id="card2-title">食堂带饭</h3>
                <p id="card2-desc">热乎饭菜送到手</p>
            </div>
        </div>

        <!-- 卡片 3 -->
        <div class="card">
            <div class="icon-box">📚</div>
            <div class="card-content">
                <h3 id="card3-title">资料打印</h3>
                <p id="card3-desc">论文作业极速印</p>
            </div>
        </div>

         <!-- 卡片 4 -->
         <div class="card">
            <div class="icon-box">💊</div>
            <div class="card-content">
                <h3 id="card4-title">代买药品</h3>
                <p id="card4-desc">急用药品帮跑腿</p>
            </div>
        </div>
    </div>

    <script>
        // 定义翻译字典
        const translations = {
            zh: {
                btnText: "语言",
                mainTitle: "CampusGo 🚀",
                subTitle: "你的校园生活小助手",
                card1Title: "代取快递",
                card1Desc: "大件重物不用愁",
                card2Title: "食堂带饭",
                card2Desc: "热乎饭菜送到手",
                card3Title: "资料打印",
                card3Desc: "论文作业极速印",
                card4Title: "代买药品",
                card4Desc: "急用药品帮跑腿"
            },
            ko: {
                btnText: "언어",
                mainTitle: "CampusGo 🚀",
                subTitle: "캠퍼스 라이프 도우미",
                card1Title: "택배 수령",
                card1Desc: "무거운 짐 걱정 끝",
                card2Title: "식당 식사 배달",
                card2Desc: "따뜻한 밥을 문앞까지",
                card3Title: "자료 인쇄",
                card3Desc: "레포트 및 과제 빠른 출력",
                card4Title: "약국 심부름",
                card4Desc: "급한 약 구매 대행"
            }
        };

        // 当前语言状态，默认为中文 'zh'
        let currentLang = 'zh';

        function toggleLanguage() {
            // 切换语言状态
            if (currentLang === 'zh') {
                currentLang = 'ko';
            } else {
                currentLang = 'zh';
            }

            // 获取对应的翻译内容
            const t = translations[currentLang];

            // 更新页面上的文字
            document.getElementById('lang-text').innerText = t.btnText;
            document.getElementById('main-title').innerText = t.mainTitle;
            document.getElementById('sub-title').innerText = t.subTitle;

            document.getElementById('card1-title').innerText = t.card1Title;
            document.getElementById('card1-desc').innerText = t.card1Desc;

            document.getElementById('card2-title').innerText = t.card2Title;
            document.getElementById('card2-desc').innerText = t.card2Desc;

            document.getElementById('card3-title').innerText = t.card3Title;
            document.getElementById('card3-desc').innerText = t.card3Desc;

            document.getElementById('card4-title').innerText = t.card4Title;
            document.getElementById('card4-desc').innerText = t.card4Desc;
        }
    </script>
</body>
</html>
