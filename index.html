<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo - 校园生活助手</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
        }

        /* 顶部紫色区域样式 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px 60px; /* 底部多留点空间给卡片重叠 */
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
        }

        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 中间容器样式 */
        .container {
            padding: 0 20px;
            margin-top: -30px; /* 让卡片稍微向上进入紫色区域 */
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center; /* 让内容居中 */
        }

        /* 卡片样式 */
        .card-link {
            text-decoration: none;
            color: inherit;
            width: 100%;
            max-width: 350px; /* 限制最大宽度 */
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon {
            font-size: 30px;
            margin-right: 15px;
            background: #f0f2f5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .info {
            flex: 1;
        }

        .title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .desc {
            font-size: 12px;
            color: #888;
        }

        /* 蓝色大按钮样式 */
        .action-btn-container {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .big-button {
            display: block;
            width: 100%;
            padding: 15px 0;
            background-color: #3b82f6; /* 漂亮的蓝色 */
            color: white;
            text-decoration: none;
            border-radius: 50px; /* 圆角胶囊形状 */
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            transition: background-color 0.2s;
        }

        .big-button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <!-- 顶部紫色区域 -->
    <div class="header">
        <div class="language-switch">🌐 语言</div>
        <h1>CampusGo 🚀</h1>
        <p class="subtitle">你的校园生活小助手</p>
    </div>

    <!-- 主要内容区域 -->
    <div class="container">

        <!-- 卡片 1：代取快递 -->
        <a href="order.html" class="card-link">
            <div class="card">
                <div class="icon">📦</div>
                <div class="info">
                    <div class="title">代取快递</div>
                    <div class="desc">大件重物不用愁</div>
                </div>
            </div>
        </a>

        <!-- 卡片 2：食堂带饭 -->
        <a href="order.html" class="card-link">
            <div class="card">
                <div class="icon">🍱</div>
                <div class="info">
                    <div class="title">食堂带饭</div>
                    <div class="desc">热乎饭菜送到手</div>
                </div>
            </div>
        </a>

        <!-- 👇 这里是你要的蓝色大按钮 👇 -->
        <div class="action-btn-container">
            <a href="order.html" class="big-button">立即发布任务 &rarr;</a>
        </div>

    </div>

</body>
</html>
