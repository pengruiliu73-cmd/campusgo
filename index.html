<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo - 校园生活助手</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
        }

        /* 顶部紫色区域样式 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            /* 【修改点 1】这里把原来的 60px 改成了 30px，让紫色区域没那么长 */
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
        }

        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            margin-top: 10px;
            opacity: 0.9;
            font-size: 14px;
        }

        /* 内容容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            /* 【修改点 2】这里控制卡片整体往上提多少。
               原来是 -40px (提得太多导致被遮挡)，现在改成 -20px (稍微提一点) */
            margin-top: -20px;
            position: relative;
            z-index: 10;
        }

        /* 卡片链接样式 */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 20px;
        }

        /* 单个卡片样式 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon {
            width: 50px;
            height: 50px;
            background-color: #f0f2f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
        }

        .title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .desc {
            font-size: 12px;
            color: #888;
        }

        /* 底部大按钮样式 */
        .action-button-container {
            text-align: center;
            margin-top: 30px; /* 距离上面卡片的距离 */
            margin-bottom: 40px; /* 距离底部的距离 */
        }

        .big-btn {
            display: inline-block;
            width: 100%; /* 让按钮宽一点 */
            max-width: 300px;
            padding: 16px 0;
            background-color: #4a7df8; /* 漂亮的蓝色 */
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(74, 125, 248, 0.3);
            transition: background-color 0.2s;
        }

        .big-btn:hover {
            background-color: #3b6ad6;
        }

    </style>
</head>
<body>

    <!-- 顶部紫色区域 -->
    <div class="header">
        <div class="language-switch">🌐 语言</div>
        <h1>CampusGo 🚀</h1>
        <p class="subtitle">你的校园生活小助手</p>
    </div>

    <!-- 主要内容区域 -->
    <div class="container">

        <!-- 卡片 1：代取快递 -->
        <a href="order.html" class="card-link">
            <div class="card">
                <div class="icon">📦</div>
                <div class="info">
                    <div class="title">代取快递</div>
                    <div class="desc">大件重物不用愁</div>
                </div>
            </div>
        </a>

        <!-- 卡片 2：食堂带饭 -->
        <a href="order.html" class="card-link">
            <div class="card">
                <div class="icon">🍱</div>
                <div class="info">
                    <div class="title">食堂带饭</div>
                    <div class="desc">热乎饭菜送到手</div>
                </div>
            </div>
        </a>

        <!-- 底部大按钮 -->
        <div class="action-button-container">
            <a href="order.html" class="big-btn">立即发布任务 &rarr;</a>
        </div>

    </div>

</body>
</html>
