<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusGo - 校园生活助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa; color: #333; min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; text-align: center; position: relative;
            padding: 50px 20px 90px 20px;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
        }
        .language-switch {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.2); padding: 6px 14px;
            border-radius: 20px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 5px;
            backdrop-filter: blur(5px); transition: background 0.3s;
            user-select: none; border: 1px solid rgba(255,255,255,0.3);
        }
        .language-switch:hover { background: rgba(255, 255, 255, 0.3); }
        h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .subtitle { margin: 10px 0 0; font-size: 14px; opacity: 0.9; }
        .container {
            max-width: 600px; margin: -60px auto 0; padding: 0 20px;
            position: relative; z-index: 10;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }
        .card-link { display: block; text-decoration: none; color: inherit; }
        .card {
            background: white; border-radius: 20px; padding: 25px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: transform 0.2s, box-shadow 0.2s; height: 100%;
        }
        .card:active { transform: scale(0.96); }
        .icon-box {
            width: 50px; height: 50px; background-color: #f0f2f5; border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; margin-bottom: 15px;
        }
        .card-content h3 { margin: 0 0 5px; font-size: 16px; font-weight: 600; color: #333; }
        .card-content p { margin: 0; font-size: 12px; color: #888; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="header">
        <div class="language-switch" onclick="toggleLanguage()">
            <span>🌐</span>
            <span id="lang-text">English</span>
        </div>
        <h1 id="main-title">CampusGo 🚀</h1>
        <p class="subtitle" id="sub-title">您的校园生活助手</p>
    </div>

    <div class="container">
        <a href="order.html?type=express&lang=zh" class="card-link" data-type="express">
            <div class="card">
                <div class="icon-box">📦</div>
                <div class="card-content">
                    <h3 id="card1-title">代取快递</h3>
                    <p id="card1-desc">大件重物不用愁</p>
                </div>
            </div>
        </a>
        <a href="order.html?type=food&lang=zh" class="card-link" data-type="food">
            <div class="card">
                <div class="icon-box">🍱</div>
                <div class="card-content">
                    <h3 id="card2-title">食堂带饭</h3>
                    <p id="card2-desc">热乎饭菜送到手</p>
                </div>
            </div>
        </a>
        <a href="order.html?type=print&lang=zh" class="card-link" data-type="print">
            <div class="card">
                <div class="icon-box">📚</div>
                <div class="card-content">
                    <h3 id="card3-title">资料打印</h3>
                    <p id="card3-desc">论文作业极速印</p>
                </div>
            </div>
        </a>
        <a href="order.html?type=medicine&lang=zh" class="card-link" data-type="medicine">
            <div class="card">
                <div class="icon-box">💊</div>
                <div class="card-content">
                    <h3 id="card4-title">代买药品</h3>
                    <p id="card4-desc">急用药品帮跑腿</p>
                </div>
            </div>
        </a>
    </div>

    <script>
        const translations = {
            zh: {
                btnText: "한국어", mainTitle: "CampusGo 🚀", subTitle: "您的校园生活助手",
                card1Title: "代取快递", card1Desc: "大件重物不用愁",
                card2Title: "食堂带饭", card2Desc: "热乎饭菜送到手",
                card3Title: "资料打印", card3Desc: "论文作业极速印",
                card4Title: "代买药品", card4Desc: "急用药品帮跑腿"
            },
            ko: {
                btnText: "中文", mainTitle: "CampusGo 🚀", subTitle: "캠퍼스 라이프 도우미",
                card1Title: "택배 수령", card1Desc: "무거운 짐 걱정 끝",
                card2Title: "식당 식사 배달", card2Desc: "따뜻한 밥을 문앞까지",
                card3Title: "자료 인쇄", card3Desc: "레포트 및 과제 빠른 출력",
                card4Title: "약국 심부름", card4Desc: "급한 약 구매 대행"
            }
        };

        let currentLang = 'zh';

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'ko' : 'zh';
            updateText();
        }

        function updateText() {
            const t = translations[currentLang];
            document.getElementById('lang-text').innerText = t.btnText;
            document.getElementById('main-title').innerText = t.mainTitle;
            document.getElementById('sub-title').innerText = t.subTitle;
            document.getElementById('card1-title').innerText = t.card1Title;
            document.getElementById('card1-desc').innerText = t.card1Desc;
            document.getElementById('card2-title').innerText = t.card2Title;
            document.getElementById('card2-desc').innerText = t.card2Desc;
            document.getElementById('card3-title').innerText = t.card3Title;
            document.getElementById('card3-desc').innerText = t.card3Desc;
            document.getElementById('card4-title').innerText = t.card4Title;
            document.getElementById('card4-desc').innerText = t.card4Desc;

            // 【核心】：动态更新所有卡片的跳转链接，把当前语言传给下一页
            document.querySelectorAll('.card-link').forEach(link => {
                const type = link.getAttribute('data-type');
                link.setAttribute('href', `order.html?type=${type}&lang=${currentLang}`);
            });
        }

        window.onload = updateText;
    </script>
</body>
</html>
