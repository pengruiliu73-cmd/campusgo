<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo - 校园跑腿</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; text-align: center; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .header p { margin-top: 10px; opacity: 0.9; font-size: 14px; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: -20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
        .card:active { transform: scale(0.98); }
        .icon { font-size: 30px; margin-bottom: 10px; display: block; }
        .title { font-weight: bold; font-size: 16px; color: #333; display: block; }
        .desc { font-size: 12px; color: #888; margin-top: 5px; display: block; }
        .footer { margin-top: 30px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 顶部标题区域 -->
    <div class="header">
        <h1>CampusGo 🚀</h1>
        <p>你的校园生活小助手</p>
    </div>

    <!-- 功能按钮区域 -->
    <div class="container">
        <div class="grid">
            <!-- 按钮 1 -->
            <div class="card" onclick="alert('代取快递功能开发中...')">
                <span class="icon">📦</span>
                <span class="title">代取快递</span>
                <span class="desc">大件重物不用愁</span>
            </div>
            <!-- 按钮 2 -->
            <div class="card" onclick="alert('食堂带饭功能开发中...')">
                <span class="icon">🍱</span>
                <span class="title">食堂带饭</span>
                <span class="desc">热乎饭菜送到手</span>
            </div>
            <!-- 按钮 3 -->
            <div class="card" onclick="alert('打印服务功能开发中...')">
                <span class="icon">🖨️</span>
                <span class="title">帮忙打印</span>
                <span class="desc">资料课件轻松印</span>
            </div>
            <!-- 按钮 4 -->
            <div class="card" onclick="alert('万能求助功能开发中...')">
                <span class="icon">🙋‍♂️</span>
                <span class="title">万能求助</span>
                <span class="desc">其他小事尽管说</span>
            </div>
        </div>

        <div class="footer">
            © 2024 CampusGo Team
        </div>
    </div>

</body>
</html>
