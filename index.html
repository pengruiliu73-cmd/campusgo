<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusGo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background-color: #f5f7fa;
            color: #333;
        }

        /* 1. 紫色头部：底部留足 90px 空间 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 20px 90px 20px; /* 关键：底部 90px 留白 */
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            text-align: center;
            position: relative;
        }

        h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .subtitle { margin: 8px 0 0; font-size: 14px; opacity: 0.9; }

        /* 2. 右上角按钮：默认显示“中文” */
        .lang-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* 3. 卡片容器：往上浮 50px，但内容在安全区 */
        .container {
            padding: 0 20px;
            margin-top: -50px; /* 关键：往上骑一点，但内容不遮挡 */
            position: relative;
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 120px;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.97); }

        .icon { font-size: 32px; margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <!-- 按钮默认显示“中文” -->
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
        <h1 id="title">CampusGo</h1>
        <p class="subtitle" id="sub">您的校园生活助手</p>
    </div>

    <div class="container">
        <div class="grid">
            <a href="order.html?type=express" class="card">
                <span class="icon">📦</span>
                <span class="card-title" data-key="express">代取快递</span>
            </a>
            <a href="order.html?type=food" class="card">
                <span class="icon">🍱</span>
                <span class="card-title" data-key="food">食堂带饭</span>
            </a>
            <a href="order.html?type=print" class="card">
                <span class="icon">📚</span>
                <span class="card-title" data-key="print">资料打印</span>
            </a>
            <a href="order.html?type=medicine" class="card">
                <span class="icon">💊</span>
                <span class="card-title" data-key="medicine">代买药品</span>
            </a>
        </div>
    </div>

    <script>
        // 语言包
        const langPack = {
            zh: {
                btn: "한국어",      // 当前中文，按钮显示“点我切韩语”
                sub: "您的校园生活助手",
                express: "代取快递", food: "食堂带饭",
                print: "资料打印", medicine: "代买药品"
            },
            ko: {
                btn: "中文",        // 当前韩语，按钮显示“点我切中文”
                sub: "캠퍼스 라이프 도우미",
                express: "택배 수령", food: "식당 배달",
                print: "자료 인쇄", medicine: "약 구매"
            }
        };

        // 读取记忆，默认中文
        let lang = localStorage.getItem('cg_lang') || 'zh';

        function render() {
            const t = langPack[lang];
            // 1. 按钮显示“目标语言”（当前中文 -> 显示 한국어）
            document.getElementById('langBtn').innerText = t.btn;
            document.getElementById('sub').innerText = t.sub;

            // 2. 更新卡片
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (t[key]) el.innerText = t[key];
            });
        }

        function toggleLang() {
            lang = lang === 'zh' ? 'ko' : 'zh';
            localStorage.setItem('cg_lang', lang);
            render();
        }

        render(); // 初始化
    </script>
</body>
</html>
