<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusGo</title>
    <style>
        /* 基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }

        /* 顶部紫色区域 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            /* 关键：底部内边距加大到 90px，防止挡住卡片 */
            padding: 50px 20px 90px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 语言切换按钮 */
        .lang-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .lang-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* 内容区域容器 */
        .container {
            padding: 0 20px;
            margin-top: -40px; /* 让卡片稍微往上浮一点，产生层叠感 */
            position: relative;
            z-index: 2;
        }

        /* 网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* 功能卡片 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 140px; /* 固定高度，整齐划一 */
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

    </style>
</head>
<body>

    <!-- 头部 -->
    <div class="header">
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">中文</button>
        <h1 id="appTitle">CampusGo</h1>
        <p id="appSubtitle">您的校园生活助手</p>
    </div>

    <!-- 内容区 -->
    <div class="container">
        <div class="grid">
            <div class="card">
                <div class="icon">📦</div>
                <div class="title" data-i18n="express">代取快递</div>
            </div>
            <div class="card">
                <div class="icon">🍱</div>
                <div class="title" data-i18n="food">食堂带饭</div>
            </div>
            <div class="card">
                <div class="icon">📚</div>
                <div class="title" data-i18n="print">资料打印</div>
            </div>
            <div class="card">
                <div class="icon">💊</div>
                <div class="title" data-i18n="medicine">代买药品</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 定义翻译字典
        const translations = {
            zh: {
                btn: "韩文", // 当前是中文，按钮显示“切换到韩文”
                title: "CampusGo",
                subtitle: "您的校园生活助手",
                express: "代取快递",
                food: "食堂带饭",
                print: "资料打印",
                medicine: "代买药品"
            },
            ko: {
                btn: "中文", // 当前是韩文，按钮显示“切换到中文”
                title: "CampusGo",
                subtitle: "캠퍼스 라이프 도우미",
                express: "택배 수령",
                food: "식당 식사 배달",
                print: "자료 인쇄",
                medicine: "약국 심부름"
            }
        };

        // 2. 核心逻辑：初始化语言
        let currentLang = 'zh'; // 【关键修改】默认强制设为 'zh' (中文)

        function initLanguage() {
            // 检查本地存储是否有用户之前的选择
            const savedLang = localStorage.getItem('campus_language');

            if (savedLang) {
                // 如果有保存过的，就用保存的
                currentLang = savedLang;
            } else {
                // 如果没有保存过（第一次来），强制使用中文，忽略系统语言
                currentLang = 'zh';
            }

            applyLanguage();
        }

        // 3. 应用语言到页面
        function applyLanguage() {
            const t = translations[currentLang];

            // 更新按钮文字
            document.getElementById('langBtn').innerText = t.btn;

            // 更新标题和副标题
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('appSubtitle').innerText = t.subtitle;

            // 更新所有带有 data-i18n 属性的元素
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerText = t[key];
                }
            });

            // 保存到本地存储，下次进来记住这次的选择
            localStorage.setItem('campus_language', currentLang);
        }

        // 4. 切换语言函数
        function toggleLanguage() {
            // 简单的切换逻辑：如果是 zh 就变 ko，反之亦然
            currentLang = (currentLang === 'zh') ? 'ko' : 'zh';
            applyLanguage();
        }

        // 页面加载时执行初始化
        window.onload = initLanguage;

    </script>
</body>
</html>
